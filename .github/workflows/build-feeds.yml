name: Build RSS feeds

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}      # "Run workflow" button
  push:
    branches: [main]
    paths: ["build_feeds.py", ".github/workflows/build-feeds.yml"]

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: python build_feeds.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/
          # lastBuildDate changes every run; only commit when items changed
          if git diff --cached --quiet -I '<lastBuildDate>'; then
            echo "No feed changes."; git reset -q
          else
            git commit -m "Update feeds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
